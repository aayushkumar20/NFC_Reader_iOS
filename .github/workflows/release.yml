name: Release Package & XCFramework

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g. v1.0.0)

jobs:
  release:
    name: Build & Package Release
    runs-on: macos-15

    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install xcodegen
        run: arch -arm64 brew install xcodegen || brew install xcodegen

      - name: Generate UniversalPassportReader Project
        run: xcodegen --spec UniversalPassportReader/project.yml --project UniversalPassportReader/

      - name: Run Framework Unit Tests
        run: |
          SIM_NAME=$(xcrun simctl list devices | grep -E "iPhone" | grep -v "unavailable" | head -n 1 | sed -E 's/^[[:space:]]*([^(]+)[[:space:]]*\(([^)]+)\).*/\1/' | xargs)
          echo "Selected Simulator: $SIM_NAME"
          xcodebuild -project UniversalPassportReader/UniversalPassportReader.xcodeproj \
                     -scheme UniversalPassportReader \
                     -sdk iphonesimulator \
                     -destination "platform=iOS Simulator,name=$SIM_NAME" \
                     test

      - name: Build xcframework
        run: |
          chmod +x build_xcframework.sh
          ./build_xcframework.sh
          zip -r UniversalPassportReader.xcframework.zip UniversalPassportReader.xcframework

      - name: Archive Demo App (Unsigned)
        run: |
          xcodebuild archive \
            -project PassportReaderDemo/PassportReaderDemo.xcodeproj \
            -scheme PassportReaderDemo \
            -destination "generic/platform=iOS" \
            -archivePath archives/PassportReaderDemo.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Build IPA Package
        run: |
          mkdir -p Payload
          cp -r archives/PassportReaderDemo.xcarchive/Products/Applications/PassportReaderDemo.app Payload/
          zip -r PassportReaderDemo.ipa Payload

      - name: Get Commit Message
        id: get_commit
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
          echo "msg=$COMMIT_MSG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            UniversalPassportReader.xcframework.zip
            UniversalPassportReader.podspec
            PassportReaderDemo.ipa
          name: Release ${{ github.ref_name }} - ${{ steps.get_commit.outputs.msg }}
          body: |
            ## 🚀 UniversalPassportReader iOS Framework ${{ github.ref_name }}
            
            **Commit Action**: `${{ steps.get_commit.outputs.msg }}`
            
            We are pleased to announce the official release of `UniversalPassportReader` version `${{ github.ref_name }}`. This premium, zero-dependency iOS framework compiles native C++ and Swift targets to provide high-performance, secure ICAO Doc 9303 biometric passport and identity card reading.
            
            ### 🌟 Key Features in this Release:
            - **Customizable Credentials (`PassportAuthKey`)**: Supports standard BAC key derivation (`mrz`), Card Access Number KDF (`can`), direct 16-byte raw session keys (`customHex`), and plain ISO-7816 reads without envelope encryption (`none`).
            - **Global Layout Parsing**: Removed strict document prefix matching constraints in the MRZ parsing engine to support any 2-line or 3-line travel ID card layout (TD1, TD2, TD3).
            - **Code Correctness & Testing**: Validated against 14 unit test suites (lenient parsing, cryptographic padding, hex codecs, KDF) running on dynamic iOS Simulator destinations.
            - **Performance Benchmarks**: Bundles a standalone command-line benchmarking script measuring key derivation speed, 3DES CBC encryption, and Retail MAC calculation performance.
            - **Security & Quality Audits**: Standardized SwiftLint checks focusing on code correctness and memory retention issues (e.g. `weak_delegate` checks), coupled with automated weekly CodeQL security scans.
            
            ---
            
            ### 📦 Package Integration Guide
            
            #### 1. CocoaPods Setup (Recommended)
            Add the following specification to your application's `Podfile`:
            ```ruby
            target 'YourAppTarget' do
              use_frameworks!
              pod 'UniversalPassportReader', :git => 'https://github.com/aayushkumar20/NFC_Reader_iOS.git', :tag => '${{ github.ref_name }}'
            end
            ```
            Run `pod install` in your terminal to integrate the framework.
            
            #### 2. Manual Integration
            - Download the attached `UniversalPassportReader.xcframework.zip` archive.
            - Extract and drag `UniversalPassportReader.xcframework` into your project target's **Frameworks, Libraries, and Embedded Content** section.
            - Set selection to **Embed & Sign**.
            
            #### 3. Swift Package Manager (SPM)
            Add the package dependency using the repository link:
            `https://github.com/aayushkumar20/NFC_Reader_iOS.git`
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
