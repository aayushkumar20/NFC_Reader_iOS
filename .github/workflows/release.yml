name: Release Package & XCFramework

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g. v1.0.0)

jobs:
  release:
    name: Build & Package Release
    runs-on: macos-15

    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate UniversalPassportReader Project
        run: xcodegen --spec UniversalPassportReader/project.yml --project UniversalPassportReader/

      - name: Run Framework Unit Tests
        run: |
          SIM_NAME=$(xcrun simctl list devices | grep -E "iPhone" | grep -v "unavailable" | head -n 1 | sed -E 's/^[[:space:]]*([^(]+)[[:space:]]*\(([^)]+)\).*/\1/' | xargs)
          echo "Selected Simulator: $SIM_NAME"
          xcodebuild -project UniversalPassportReader/UniversalPassportReader.xcodeproj \
                     -scheme UniversalPassportReader \
                     -sdk iphonesimulator \
                     -destination "platform=iOS Simulator,name=$SIM_NAME" \
                     test

      - name: Build xcframework
        run: |
          chmod +x build_xcframework.sh
          ./build_xcframework.sh

      - name: Compress XCFramework
        run: zip -r UniversalPassportReader.xcframework.zip UniversalPassportReader.xcframework

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            UniversalPassportReader.xcframework.zip
            UniversalPassportReader.podspec
          name: Release ${{ github.ref_name }}
          body: |
            ## UniversalPassportReader iOS Framework Release
            
            This release packages the precompiled `.xcframework` and CocoaPods specification for `UniversalPassportReader` version `${{ github.ref_name }}`.
            
            ### Package Integration
            
            #### 1. CocoaPods Setup
            To consume this version via CocoaPods, add the following to your target definition inside your `Podfile`:
            ```ruby
            pod 'UniversalPassportReader', :git => 'https://github.com/aayushkumar20/NFC_Reader_iOS.git', :tag => '${{ github.ref_name }}'
            ```
            
            #### 2. Manual Integration
            - Download the attached `UniversalPassportReader.xcframework.zip`
            - Extract and drag it into your Xcode project's framework target.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
