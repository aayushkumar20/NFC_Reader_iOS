name: "CodeQL Security Scan"

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sundays

jobs:
  analyze:
    name: Analyze Code Security
    runs-on: macos-15

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'c-cpp', 'swift' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Install dependencies & Build
        run: |
          brew install xcodegen
          xcodegen --spec UniversalPassportReader/project.yml --project UniversalPassportReader/
          
          # Build framework to allow CodeQL to trace compiles
          xcodebuild -project UniversalPassportReader/UniversalPassportReader.xcodeproj \
                     -scheme UniversalPassportReader \
                     -sdk iphonesimulator \
                     -destination "generic/platform=iOS Simulator" \
                     clean build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
