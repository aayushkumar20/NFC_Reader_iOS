name: iOS Build and Code Quality CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Lint Code Quality
    runs-on: macos-15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging

  build:
    name: Build Framework and Demo App
    runs-on: macos-15
    needs: lint
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate UniversalPassportReader Project
        run: xcodegen --spec UniversalPassportReader/project.yml --project UniversalPassportReader/

      - name: Run Framework Unit Tests
        run: |
          SIM_NAME=$(xcrun simctl list devices | grep -E "iPhone" | grep -v "unavailable" | head -n 1 | sed -E 's/^[[:space:]]*([^(]+)[[:space:]]*\(([^)]+)\).*/\1/' | xargs)
          echo "Selected Simulator: $SIM_NAME"
          xcodebuild -project UniversalPassportReader/UniversalPassportReader.xcodeproj \
                     -scheme UniversalPassportReader \
                     -sdk iphonesimulator \
                     -destination "platform=iOS Simulator,name=$SIM_NAME" \
                     test

      - name: Build xcframework
        run: |
          chmod +x build_xcframework.sh
          ./build_xcframework.sh

      - name: Build PassportReaderDemo App
        run: |
          xcodebuild -project PassportReaderDemo/PassportReaderDemo.xcodeproj \
                     -scheme PassportReaderDemo \
                     -sdk iphonesimulator \
                     -destination "generic/platform=iOS Simulator" \
                     clean build

      - name: Compile and Run Performance Benchmarks
        run: |
          swiftc -o run_benchmarks benchmark.swift UniversalPassportReader/Sources/UniversalPassportReader/UniversalPassportReaderCore.cpp UniversalPassportReader/Sources/UniversalPassportReader/Crypto/PassportCrypto.cpp UniversalPassportReader/Sources/UniversalPassportReader/NFC/ASN1Parser.cpp -lc++ -I UniversalPassportReader/Sources/UniversalPassportReader/
          ./run_benchmarks

